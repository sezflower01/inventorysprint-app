name: Repricer Preset Tests

on:
  push:
    paths:
      - 'supabase/functions/repricer-ai-evaluate/**'
      - 'supabase/functions/_tests/repricer-ai-evaluate/**'
      - '.github/workflows/repricer-preset-tests.yml'
  pull_request:
    paths:
      - 'supabase/functions/repricer-ai-evaluate/**'
      - 'supabase/functions/_tests/repricer-ai-evaluate/**'
      - '.github/workflows/repricer-preset-tests.yml'

# Behavior-lock guard: these tests prove that the 7 repricer presets (Aggressive
# Capture / Momentum Builder / Profit Extractor / Match Buy Box / Match Lowest /
# Smart Match / Momentum Smart) remain semantically distinct
# (snapshot + uniqueness suite) and behave correctly under realistic market
# conditions (scenario suite + underpriced-recovery/anomaly/fast-lane-cooldown
# suite). Failure here means a preset has silently drifted — block the merge.
jobs:
  preset-behavior-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run preset snapshot tests (identity + uniqueness)
        run: deno test --allow-net --allow-env --allow-read supabase/functions/_tests/repricer-ai-evaluate/presets_snapshot_test.ts

      - name: Run behavioral scenario tests
        run: deno test --allow-net --allow-env --allow-read supabase/functions/_tests/repricer-ai-evaluate/scenarios_test.ts

      - name: Run underpriced-recovery + anomaly + fast-lane cooldown tests
        run: deno test --allow-net --allow-env --allow-read supabase/functions/_tests/repricer-ai-evaluate/recovery_test.ts
