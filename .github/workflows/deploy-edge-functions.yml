name: Deploy Edge Functions

# Auto-deploys Supabase Edge Functions on push to main, mirroring how Vercel
# auto-deploys the frontend. Before this workflow existed, a function fix
# committed to supabase/functions/** would sit undeployed until someone ran
# `supabase functions deploy <name>` by hand (see the sync-sales-orders
# pricing fix that needed a manual deploy).
#
# Only functions that actually changed in the pushed commits are deployed
# (detected via git diff), not the whole ~150-function fleet every time.
# Exception: a change under supabase/functions/_shared/** redeploys every
# function, since any of them may import shared code and there's no cheap
# way to compute which ones without parsing imports.
#
# Deletions are NOT synced here on purpose -- `supabase functions deploy`
# only pushes new/changed code. Removing a function from Supabase is a
# separate, deliberate action and stays manual.

on:
  # Manual trigger exists so the deploy path can be TESTED without manufacturing
  # a commit. Added 2026-08-19: the workflow reported success for 205 runs while
  # deploying nothing, and there was no way to exercise it on demand to find
  # that out. Pass a single function name to keep a diagnostic run cheap.
  workflow_dispatch:
    inputs:
      target:
        description: 'Function to deploy (blank = every function)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

concurrency:
  group: deploy-edge-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy changed Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff github.event.before...github.sha

      # PINNED, not `latest`, and the pin is load-bearing.
      #
      # CLI 2.115 validates the WHOLE config.toml on every command, including
      #   [auth.hook.send_email] secrets = "env(SEND_EMAIL_HOOK_SECRET)"
      # That variable does not exist on the runner, so it resolves to empty,
      # fails the "v1,whsec_<base64>" format check, and EVERY command aborts:
      #   Invalid hook config: auth.hook.send_email.secrets must be formatted
      #   as "v1,whsec_<base64_encoded_secret>" ...
      # All 254 deploys failed this way on 2026-08-19, each in about a second,
      # before uploading anything. Reproduced locally: 2.115 fails with the
      # variable unset, 2.109.1 succeeds with it equally unset.
      #
      # The DURABLE fix is to give the runner the real secret -- add
      # SEND_EMAIL_HOOK_SECRET to repo secrets and set it in the step env below
      # -- after which this can go back to `latest`. Deliberately NOT worked
      # around with a dummy value: the CLI is trusted with config here, and a
      # placeholder in a field that governs auth email signing is the kind of
      # thing that is only discovered when password resets stop working.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Determine changed functions and deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: mstibdszibcheodvnprm
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          DISPATCH_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail

          # Deploy a newline-separated list, and put the CLI's OWN error text
          # into the ::error:: annotation.
          #
          # This used to be a bare "Failed to deploy $fn" with the CLI output
          # left in the log. GitHub exposes annotations over the public API but
          # gates log downloads behind auth, so the one line that said WHY was
          # the one line nobody without repo access could read -- which is
          # exactly the situation on 2026-08-19, when all 254 deploys failed and
          # the reason was unobtainable. The message is truncated because
          # annotations are capped, and capped at 10 per run.
          # --use-api: bundle SERVER-SIDE, no Docker. Load-bearing on a runner.
          #
          # Without it the CLI bundles locally by pulling
          # public.ecr.aws/supabase/edge-runtime:<ver>, and ECR Public throttles
          # anonymous pulls per source IP. GitHub's hosted runners share NAT'd
          # egress IPs with everyone else on the same range, so the pull fails
          # with "toomanyrequests: Rate exceeded" -> "failed to bundle function:
          # exit 125" before a single byte is uploaded. Run 289 (2026-09-29)
          # died that way in 30s on a one-function deploy; nothing about the
          # function was wrong. It is a shared-quota lottery, so a plain re-run
          # is a coin flip, not a fix.
          #
          # Server-side bundling has no image to pull and no daemon to talk to.
          # Keep it even if the pin below moves: a Docker-free deploy path is
          # the point, not a workaround for one CLI version.
          deploy_all() {
            local list="$1" failed="" out="" deployed=0 attempt=0
            while IFS= read -r fn; do
              [ -z "$fn" ] && continue
              if [ ! -f "supabase/functions/$fn/index.ts" ]; then
                echo "Skipping '$fn' — no index.ts (not a deployable function, or was deleted)."
                continue
              fi
              # Retried, because one flake must not fail a fleet redeploy.
              #
              # Run 290 (2026-09-29) deployed all ~262 functions after a
              # _shared/** change and lost exactly one, check-seller-watchlist,
              # to a server-side "unexpected deploy status 500: Function deploy
              # failed due to an internal error". Deploying it again by hand
              # immediately afterwards worked, unchanged -- so it was Supabase's
              # flake, not the function. Three attempts with a widening pause;
              # the annotation is written only once every attempt has failed.
              echo "::group::Deploying $fn"
              deployed=0
              for attempt in 1 2 3; do
                if out=$(supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID" --use-api 2>&1); then
                  echo "$out"
                  deployed=1
                  break
                fi
                echo "$out"
                if [ "$attempt" -lt 3 ]; then
                  echo "Attempt $attempt for $fn failed; retrying in $((attempt * 10))s."
                  sleep $((attempt * 10))
                fi
              done
              if [ "$deployed" -ne 1 ]; then
                echo "::error::Failed to deploy $fn after 3 attempts :: $(echo "$out" | tr '\n' ' ' | tail -c 600)"
                failed="$failed $fn"
              fi
              echo "::endgroup::"
            done <<< "$list"

            if [ -n "$failed" ]; then
              echo "::error::One or more functions failed to deploy:$failed"
              return 1
            fi
            return 0
          }

          # FAILS, does not skip. This was `::warning::` + `exit 0` until
          # 2026-08-19, and the secret had never been set -- so every run since
          # the workflow was added reported a green tick having deployed
          # nothing, for at least the 205 runs the API still holds. The deploy
          # step took 0 seconds every time; run durations of 14-108s were
          # runner and CLI-install overhead, which is exactly what made it look
          # like real deploys were happening.
          #
          # A red push is recoverable. A green one that shipped nothing is not
          # noticed at all -- the fleet drifted for weeks behind a passing
          # check, and the only reliable statement of what is live became
          # `supabase functions list` rather than the commit log.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN not set — cannot deploy. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

          # BEFORE_SHA is the all-zero SHA on a new branch / first push, and
          # can also point at a commit this shallow-fetched history doesn't
          # have in rare force-push cases. Fall back to the immediate parent
          # of AFTER_SHA so we still diff *something* sane instead of failing
          # or silently deploying nothing.
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "No usable previous SHA (new branch or force-push) — diffing against the immediate parent commit instead."
            BEFORE_SHA=$(git rev-parse "${AFTER_SHA}~1" 2>/dev/null || echo "")
          fi

          if [ -z "$BEFORE_SHA" ]; then
            echo "No parent commit available (first commit on the repo?) — nothing to diff, skipping."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$DISPATCH_TARGET" ]; then
              echo "Manual run for a single function: $DISPATCH_TARGET"
              FUNCS_TO_DEPLOY="$DISPATCH_TARGET"
            else
              echo "Manual run for every function."
              FUNCS_TO_DEPLOY=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
                ! -name '_shared' ! -name '_tests' -printf '%f\n' | sort)
            fi
            deploy_all "$FUNCS_TO_DEPLOY"
            exit $?
          fi

          CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- supabase/functions/)
          echo "Changed files under supabase/functions/:"
          echo "$CHANGED_FILES"

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes under supabase/functions/ — nothing to deploy."
            exit 0
          fi

          SHARED_CHANGED=false
          if echo "$CHANGED_FILES" | grep -q '^supabase/functions/_shared/'; then
            SHARED_CHANGED=true
          fi

          if [ "$SHARED_CHANGED" = "true" ]; then
            echo "supabase/functions/_shared/** changed — redeploying every function (can't cheaply tell which ones import it)."
            FUNCS_TO_DEPLOY=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
              ! -name '_shared' ! -name '_tests' -printf '%f\n' | sort)
          else
            FUNCS_TO_DEPLOY=$(echo "$CHANGED_FILES" \
              | sed -E 's#^supabase/functions/([^/]+)/.*#\1#' \
              | sort -u \
              | grep -v -E '^(_shared|_tests)$' || true)
          fi

          if [ -z "$FUNCS_TO_DEPLOY" ]; then
            echo "No deployable function directories in the changed set — nothing to deploy."
            exit 0
          fi

          echo "Functions to deploy:"
          echo "$FUNCS_TO_DEPLOY"

          supabase link --project-ref "$SUPABASE_PROJECT_ID"

          deploy_all "$FUNCS_TO_DEPLOY"
